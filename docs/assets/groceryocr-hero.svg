<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">GroceryOCR — Scan recipes. Shop once.</title>
  <desc id="description">A product banner showing recipe scanning becoming a clean grocery list through on-device OCR and deterministic ingredient grouping.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9F4"/>
      <stop offset="0.55" stop-color="#ECF4EA"/>
      <stop offset="1" stop-color="#DCEBDE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C8053"/>
      <stop offset="1" stop-color="#185E3C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="34" fill="url(#background)"/>
  <circle cx="1085" cy="62" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="1116" cy="394" r="205" fill="#BFD9C4" opacity="0.32"/>

  <g transform="translate(72 70)">
    <rect width="186" height="34" rx="17" fill="#D6E9D9"/>
    <circle cx="20" cy="17" r="6" fill="#237649"/>
    <text x="34" y="22" fill="#185E3C" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">GROCERYOCR FOR iOS</text>

    <text x="0" y="112" fill="#123426" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2">SCAN RECIPES.</text>
    <text x="0" y="182" fill="#237649" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-style="italic" font-weight="700" letter-spacing="-1.5">Shop once.</text>

    <text x="2" y="234" fill="#355B48" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500">On-device OCR. Deterministic grouping.</text>
    <text x="2" y="265" fill="#355B48" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500">One practical Imperial grocery list.</text>

    <g transform="translate(0 305)">
      <rect width="202" height="42" rx="21" fill="url(#accent)"/>
      <text x="101" y="27" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">PRIVATE BY DEFAULT</text>
      <text x="226" y="27" fill="#315D46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650">APPLE-NATIVE</text>
      <circle cx="345" cy="21" r="3" fill="#6E927D"/>
      <text x="360" y="27" fill="#315D46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650">EXPLAINABLE</text>
    </g>
  </g>

  <g transform="translate(800 50)">
    <rect width="342" height="360" rx="30" fill="#FFFFFF"/>
    <rect x="0.75" y="0.75" width="340.5" height="358.5" rx="29.25" fill="none" stroke="#D6E4D8" stroke-width="1.5"/>
    <rect x="126" y="14" width="90" height="6" rx="3" fill="#D8E0DA"/>
    <text x="30" y="64" fill="#18392B" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="760">Shopping List</text>
    <text x="311" y="62" text-anchor="end" fill="#60806E" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">4 ITEMS</text>
    <line x1="30" y1="82" x2="312" y2="82" stroke="#E6ECE7"/>

    <g transform="translate(30 106)">
      <circle cx="14" cy="14" r="14" fill="#E3F0E5"/>
      <path d="M8 14.5l4 4 8-9" fill="none" stroke="#237649" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="12" fill="#1D382C" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700">Yellow onions</text>
      <text x="44" y="32" fill="#668072" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13">Need 1¼ · Buy 2</text>
    </g>

    <g transform="translate(30 172)">
      <circle cx="14" cy="14" r="14" fill="#E3F0E5"/>
      <path d="M8 14.5l4 4 8-9" fill="none" stroke="#237649" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="12" fill="#1D382C" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700">Mushrooms</text>
      <text x="44" y="32" fill="#668072" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13">Buy 1 lb</text>
    </g>

    <g transform="translate(30 238)">
      <circle cx="14" cy="14" r="14" fill="#E3F0E5"/>
      <path d="M8 14.5l4 4 8-9" fill="none" stroke="#237649" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="12" fill="#1D382C" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700">Steak</text>
      <text x="44" y="32" fill="#668072" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13">Buy 2 lb</text>
    </g>

    <rect x="30" y="304" width="282" height="38" rx="12" fill="#F0F5F0"/>
    <text x="171" y="329" text-anchor="middle" fill="#237649" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="750">READY TO SHOP</text>
  </g>
</svg>
